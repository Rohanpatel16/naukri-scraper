import asyncio
import random
import pandas as pd
from playwright.async_api import async_playwright
from datetime import datetime

# SAFE STEALTH IMPORT
try:
    from playwright_stealth import stealth_async
except ImportError:
    try:
        # Try alternative import path for newer versions
        from playwright_stealth.stealth import stealth_async
    except ImportError:
        print("Stealth library failed to import. Running without stealth...")
        stealth_async = None

async def scrape_naukri():
    async with async_playwright() as p:
        # Launch browser
        browser = await p.chromium.launch(headless=True)
        
        # Use a very specific User Agent
        context = await browser.new_context(
            user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
            viewport={'width': 1920, 'height': 1080}
        )
        
        page = await context.new_page()
        
        # Apply Stealth if available
        if stealth_async:
            await stealth_async(page)
        
        # Naukri Search URL
        url = "https://www.naukri.com/python-developer-jobs-in-bangalore"
        print(f"Navigating to {url}...")
        
        try:
            # 1. Start at home to get "real" cookies
            await page.goto("https://www.naukri.com/", wait_until="domcontentloaded", timeout=60000)
            await asyncio.sleep(random.uniform(2, 4))
            
            # 2. Go to the target job page
            await page.goto(url, wait_until="networkidle", timeout=60000)
            await asyncio.sleep(random.uniform(3, 5))

            # 3. Extract the hidden JSON (window.__INITIAL_STATE__)
            raw_data = await page.evaluate("() => window.__INITIAL_STATE__")
            
            job_list = []
            if raw_data:
                try:
                    # Drilling down into the Naukri JSON structure
                    details = raw_data.get('answer', {}).get('details', {})
                    bulk_data = details.get('jobDetails', [])
                    
                    for job in bulk_data:
                        job_list.append({
                            "title": job.get('title'),
                            "company": job.get('companyName'),
                            "location": job.get('placeholders', [{}])[0].get('label'),
                            "url": f"https://www.naukri.com{job.get('jdURL')}",
                            "scraped_at": datetime.now().strftime("%Y-%m-%d")
                        })
                except Exception as e:
                    print(f"JSON parsing error: {e}")

            # 4. Save results or debug
            if job_list:
                df = pd.DataFrame(job_list)
                df.to_csv("naukri_data.csv", index=False)
                print(f"Successfully saved {len(job_list)} jobs.")
            else:
                # Capture a screenshot so we can see why it failed (Captcha/Block)
                await page.screenshot(path="error_screen.png")
                # Save the HTML for deeper debugging
                html_content = await page.content()
                with open("error_page.html", "w", encoding="utf-8") as f:
                    f.write(html_content)
                print("No jobs found. Check the 'debug-files' artifact in GitHub Actions.")

        except Exception as e:
            print(f"Critical error during scraping: {e}")
            await page.screenshot(path="error_screen.png")
        finally:
            await browser.close()

if __name__ == "__main__":
    asyncio.run(scrape_naukri())
