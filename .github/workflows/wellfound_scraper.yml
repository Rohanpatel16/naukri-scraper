name: Wellfound Job Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Wellfound Search URL (e.g. https://wellfound.com/role/l/software-engineer/india)'
        required: true
        default: 'https://wellfound.com/role/l/software-engineer/india'
      pages:
        description: 'Number of pages to scrape (leave empty to auto-scrape all available pages)'
        required: false
        default: ''
      days:
        description: 'Filter recent jobs posted within last N days (optional, e.g. 3, 7, 14)'
        required: false
        default: ''
      hours:
        description: 'Filter recent jobs posted within last N hours (optional, e.g. 24, 48)'
        required: false
        default: ''

jobs:
  scrape-wellfound:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Wellfound Scraper
        run: |
          URL="${{ github.event.inputs.url }}"
          PAGES="${{ github.event.inputs.pages }}"
          DAYS="${{ github.event.inputs.days }}"
          HOURS="${{ github.event.inputs.hours }}"

          CMD="python -m naukri_scraper.wellfound_cli --url \"$URL\" --output wellfound_companies.csv"
          if [ -n "$PAGES" ]; then
            CMD="$CMD --pages $PAGES"
          fi
          if [ -n "$DAYS" ]; then
            CMD="$CMD --days $DAYS"
          fi
          if [ -n "$HOURS" ]; then
            CMD="$CMD --hours $HOURS"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Upload Wellfound Companies CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wellfound-companies-csv
          path: wellfound_companies.csv
          retention-days: 30
