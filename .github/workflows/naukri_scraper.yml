name: Naukri Job Scraper

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct Naukri search URL (will automatically scrape all matching jobs & pages)'
        required: true
        default: 'https://www.naukri.com/jobs-in-india?functionAreaIdGid=4&functionAreaIdGid=5&functionAreaIdGid=8&jobAge=1&clusters=functionalAreaGid,Freshness'
      keywords:
        description: 'Keywords to search (optional; used only if URL is empty)'
        required: false
        default: ''
      location:
        description: 'Location filter (optional)'
        required: false
        default: ''
      experience:
        description: 'Target experience years (optional)'
        required: false
        default: ''
      hours:
        description: 'Time limit in hours (optional, e.g. 24)'
        required: false
        default: ''

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r naukri_scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Naukri Scraper
        run: |
          URL="${{ github.event.inputs.url }}"
          KEYWORDS="${{ github.event.inputs.keywords }}"
          LOCATION="${{ github.event.inputs.location }}"
          EXPERIENCE="${{ github.event.inputs.experience }}"
          HOURS="${{ github.event.inputs.hours }}"

          if [ -n "$URL" ]; then
            CMD="python -m naukri_scraper.cli --url \"$URL\" --output naukri_jobs.csv"
          else
            CMD="python -m naukri_scraper.cli --keywords ${KEYWORDS:-'python'} --output naukri_jobs.csv"
            if [ -n "$LOCATION" ]; then
              CMD="$CMD --location \"$LOCATION\""
            fi
            if [ -n "$EXPERIENCE" ]; then
              CMD="$CMD --experience $EXPERIENCE"
            fi
            if [ -n "$HOURS" ]; then
              CMD="$CMD --hours $HOURS"
            fi
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Upload Scraped CSVs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naukri-scraped-data
          path: |
            naukri_companies.csv
            naukri_jobs.csv
          retention-days: 30
